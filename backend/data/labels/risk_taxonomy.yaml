# 监管问询关注点标签体系 v1.1（冻结版）
# 来源: docs/标注规范_risk_taxonomy_v1.1_冻结版.md
# 验证: 300条双人独立试标，一级主题一致率90.7%，二级80.0%，无法归类率5.7%
# 用途: F1系统 02_风险标签抽取模块 / 05_LLM模板 统一使用本体系

version: "1.1-frozen"

# ===== 主分类维度：风险主题（8个一级 + 45个核心二级）=====
risk_themes:
  A:
    name: "经营业绩与商业模式"
    core_subthemes:
      A01: "收入规模与收入变动"
      A02: "成本费用与毛利率"
      A03: "利润、扣非利润与业绩波动"
      A04: "业务模式与商业实质"
      A05: "客户与供应商集中度"
      A06: "经营稳定性与持续经营能力"
    extended_tags: ["重大合同与订单", "产能产量与项目进展", "主营业务具体变化"]
  B:
    name: "财务报告与会计处理"
    core_subthemes:
      B01: "收入确认与截止性"
      B02: "成本费用确认与资本化"
      B03: "会计政策、会计估计与差错更正"
      B04: "合并报表范围"
      B05: "非经常性损益与政府补助"
    extended_tags: ["科目列报与重分类", "其他会计确认和计量"]
  C:
    name: "资产质量与减值"
    core_subthemes:
      C01: "应收账款与坏账准备"
      C02: "存货与跌价准备"
      C03: "商誉与商誉减值"
      C04: "固定资产与在建工程"
      C05: "无形资产、研发支出与资本化"
      C06: "其他资产与投资资产"
    extended_tags: ["资产减值计提充分性", "资产真实性", "资产可回收性"]
  D:
    name: "资金、现金流与偿债"
    core_subthemes:
      D01: "经营现金流与利润匹配"
      D02: "货币资金真实性、受限资金与存贷双高"
      D03: "债务结构与偿债能力"
      D04: "债务逾期、违约与展期"
      D05: "担保、抵质押与或有负债"
      D06: "融资安排与募集资金使用"
    extended_tags: ["存贷双高", "特定融资工具", "单项诉讼或仲裁"]
  E:
    name: "交易、关联方与资本运作"
    core_subthemes:
      E01: "交易商业实质、合理性与定价公允性"
      E02: "关联方识别与关联交易"
      E03: "非经营性资金占用"
      E04: "资产购买、出售与年末突击交易"
      E05: "并购重组与重大资产交易"
      E06: "估值方法与评估合理性"
      E07: "业绩承诺、补偿安排与对赌协议"
    extended_tags: ["对外投资与普通股权投资"]
  F:
    name: "股东、控制权与公司治理"
    core_subthemes:
      F01: "控股股东与实际控制人"
      F02: "控制权变更与稳定性"
      F03: "股权质押、冻结与司法处置"
      F04: "增减持、回购、股权激励与权益变动"
      F05: "董监高履职与人员变动"
      F06: "内部控制、三会治理与公司独立性"
    extended_tags: ["子公司管控", "同业竞争", "业务独立性"]
  G:
    name: "审计、披露与监管合规"
    core_subthemes:
      G01: "审计意见与非标准审计意见"
      G02: "审计证据充分性与审计范围受限"
      G03: "会计师事务所变更与中介机构胜任能力"
      G04: "信息披露完整性"
      G05: "信息披露及时性"
      G06: "前后披露一致性、数据准确性与勾稽关系"
      G07: "立案调查、监管处罚与其他合规事项"
    extended_tags: ["风险提示不足", "律师核查不足", "评估机构核查不足", "其他中介责任"]
  H:
    name: "市场交易与证券行为"
    note: "尾部类别；无法归类样本进入 H-OTHER 观察池"
    core_subthemes:
      H01: "股价、成交量与市场交易异常"
      H02: "市场传闻、媒体报道与澄清"
    extended_tags: ["停复牌事项", "内幕信息与敏感期交易", "其他证券市场行为"]

# ===== 属性维度一：质疑性质（13个）=====
# 标注规则：必选1个主要 + 最多1个辅助
question_types:
  Q01: "真实性"
  Q02: "准确性"
  Q03: "完整性"
  Q04: "一致性"
  Q05: "合理性"
  Q06: "公允性"
  Q07: "商业实质"
  Q08: "充分性"
  Q09: "审慎性"
  Q10: "可持续性"
  Q11: "合规性"
  Q12: "及时性"
  Q13: "独立性"

# ===== 属性维度二：风险发生或核查环节（8个）=====
# 说明：参考性标注，不参与正式分类准确率考核
stages:
  P01: "业务形成与交易设计"
  P02: "合同履约与资金流转"
  P03: "会计确认与计量"
  P04: "财务列报与报表勾稽"
  P05: "内部控制与治理审批"
  P06: "审计鉴证与中介核查"
  P07: "信息披露与风险提示"
  P08: "监管调查、整改与反馈"

# ===== 易混类别判定规则（用于提示词与人工标注）=====
disambiguation_rules:
  - pair: "A ↔ E"
    rule: "关注点核心是交易本身的结构与定价 → E；核心是交易对经营业绩的影响 → A"
  - pair: "E01 ↔ E06"
    rule: "涉及评估报告、评估方法、评估参数 → E06；仅讨论交易价格是否公允、不涉及评估技术 → E01"
  - pair: "B03 ↔ B05"
    rule: "核心是补助/损益的性质认定 → B05；核心是会计处理方法是否恰当 → B03"
  - pair: "G04 ↔ G07"
    rule: "涉及具体监管行动（立案、处罚、监管措施）→ G07；仅为披露内容不完整 → G04"
  - pair: "C01 ↔ C06"
    rule: "应收账款及其坏账准备 → C01；预付款、其他应收款、投资类资产 → C06"
  - pair: "Q08 ↔ Q09"
    rule: "涉及减值、准备计提一律用 Q08充分性；Q09仅在明确讨论会计估计偏乐观/偏悲观时使用"
  - pair: "Q03 ↔ Q05"
    rule: "监管要求'补充披露/补充说明某项内容' → Q03；要求'说明原因/说明合理性' → Q05"
  - pair: "Q05 ↔ Q10"
    rule: "明确涉及持续经营能力、业务可持续性 → Q10；其他一般合理性质疑 → Q05"
  - pair: "Q01 ↔ Q03"
    rule: "质疑内容是否属实、是否存在 → Q01；质疑是否披露齐全 → Q03"
  - pair: "P01 ↔ P03"
    rule: "质疑交易如何设计、商业安排 → P01；质疑账务如何确认计量 → P03"
  - pair: "P03 ↔ P04"
    rule: "确认与计量方法 → P03；列报、科目分类、报表勾稽 → P04"

# ===== 标注约束 =====
annotation_constraints:
  primary_theme_l1: required   # 必选1个（A-H）
  primary_theme_l2: required   # 必选1个（完整编码如A06，不可只填字母）
  secondary_theme_l2: optional # 最多1个
  primary_question_type: required  # 必选1个
  secondary_question_type: optional # 最多1个
  primary_stage: reference     # 参考性，不参与评分
  unclassifiable: "归入对应大类 OTHER 观察池，不强行归类"